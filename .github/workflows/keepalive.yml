name: Keep-alive Supabase (Hogar+)

on:
  schedule:
    # Lunes y jueves a las 13:00 UTC (8:00 a. m. Bogotá)
    - cron: '0 13 * * 1,4'
  workflow_dispatch: {}   # botón "Run workflow" para probar a mano

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Intento $intento → HTTP $code · $(cat respuesta.txt)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Supabase no respondió correctamente tras 3 intentos"
          exit 1

      # GitHub desactiva los workflows programados si el repo pasa 60 días
      # sin commits. Este paso hace un commit mínimo solo cuando el último
      # tiene más de 45 días, para que el keep-alive nunca se apague.
      - name: Mantener activo el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Commit de mantenimiento (solo si hace falta)
        run: |
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          dias=$(( (ahora - ultimo) / 86400 ))
          echo "Días desde el último commit: $dias"
          if [ "$dias" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name  "hogar-plus-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keep-alive del repositorio"
            git push
          fi
